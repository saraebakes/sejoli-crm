<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donasi Sejoli</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0d6efd;min-height:100vh}
.container{max-width:420px;margin:1rem auto;background:#fff;border-radius:16px;padding:1.5rem}
h2{color:#0a2540;text-align:center}
label{display:block;font-weight:600;margin:.8rem 0 .3rem;color:#0a2540}
input,textarea{width:100%;padding:.75rem;border:1.5px solid #e0e0e0;border-radius:12px;font-size:1rem}
.portion{display:flex;align-items:center;justify-content:center;gap:1rem;margin:1rem 0}
.portion button{width:48px;height:48px;border-radius:12px;border:none;background:#0a2540;color:#fff;font-size:1.4rem}
.total{background:#fff3cd;border-radius:14px;padding:1rem;text-align:center}
.total .rp{font-size:2rem;font-weight:800;color:#0a2540}
button.submit{width:100%;padding:.85rem;background:#0a2540;color:#fff;border:none;border-radius:12px;font-weight:700;margin-top:.5rem}
.cs{text-align:center;margin-top:1rem;font-weight:700;color:#ffd60a;background:#0a2540;padding:.8rem;border-radius:12px}
</style>
</head>
<body>
<div class="container">
  <h2>Mau berdonasi?</h2>
  <p style="text-align:center;font-weight:600">1 porsi Rp 20.001</p>
  <form id="f" onsubmit="return kirim(event)">
    <label>Nama</label><input id="nama" required placeholder="Nama donatur">
    <label>WA</label><input id="wa" required placeholder="08...">
    <label>Pesan (opsional)</label><textarea id="pesan"></textarea>
    <label>Target jurusan (opsional)</label><input id="jurusan" placeholder="Kosongkan jika umum">
    <label>Target NIM spesifik (opsional)</label><input id="nim" placeholder="Kosongkan jika bukan spesifik">
    <div class="portion">
      <button type="button" onclick="chg(-1)">-</button>
      <div id="porsi">1</div>
      <button type="button" onclick="chg(1)">+</button>
    </div>
    <div class="total"><div class="rp" id="total">Rp 20.001</div><div>yang harus ditransfer</div></div>
    <button type="submit" class="submit">Catat donasi</button>
  </form>
  <div class="cs">CS Sejoli : +62 851-2293-8694</div>
  <p style="text-align:center"><a href="/daftar">Kembali ke voucher</a></p>
  <div id="msg"></div>
</div>
<script>
let p=1; const harga=20001;
function chg(d){p=Math.max(1,p+d);document.getElementById('porsi').textContent=p;document.getElementById('total').textContent='Rp '+(p*harga).toLocaleString('id-ID');}
function kirim(e){
  e.preventDefault();
  const data={donor_nama:document.getElementById('nama').value,donor_wa:document.getElementById('wa').value,porsi:p,pesan:document.getElementById('pesan').value,target_jurusan:document.getElementById('jurusan').value||null,target_nim:document.getElementById('nim').value||null,tipe:document.getElementById('nim').value?'spesifik':(document.getElementById('jurusan').value?'jurusan':'umum')};
  fetch('/api/donations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(r=>r.json()).then(d=>{
      document.getElementById('msg').innerHTML=d.ok?('<div style="color:green;margin-top:1rem">Donasi tercatat! Kode: <b>'+d.kode+'</b><br>Transfer Rp '+d.total.toLocaleString('id-ID')+' lalu kirim bukti ke CS.</div>'):('<div style="color:red">'+(d.error||'Gagal')+'</div>');
    });
  return false;
}
</script>
</body>
</html>
